---
# tasks file for smax_lifecycle
- name: Include SMAX Stop Tasks
  ansible.builtin.include_tasks: stop.yml
  when: smax_stop | bool

- name: Include SMAX Start Tasks
  ansible.builtin.include_tasks: start.yml
  when: smax_start | bool

- name: Include Report Generation Task
  ansible.builtin.include_tasks: generate_report.yml
  when: smax_stop | bool or smax_start | bool