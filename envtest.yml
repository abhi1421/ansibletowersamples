---
- name: Collect SFMSP environment
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Collect SFMSP environment
      ansible.builtin.shell: |
        printf 'printf "__ENV_START__\n"; env; printf "__ENV_END__\n"; exit\n' |
        sudo su - sfmspad -c ':'
      register: sfmspad_env
      changed_when: false

    - name: Extract environment block
      ansible.builtin.set_fact:
        sfmspad_env_clean: >-
          {{
            sfmspad_env.stdout
            | split('__ENV_START__')
            | last
            | split('__ENV_END__')
            | first
          }}    

    - name: Display clean environment
      ansible.builtin.debug:
        var: sfmspad_env_clean