---
# =================================================================
# TASK 1 DR READINESS PRE-CHECK FRAMEWORK
# =================================================================
- name: Stage 00 - AIX PowerHA Cluster Readiness Check (All 8 Nodes)
  hosts: "{{ SWITCHOVER_FROM }}:{{ SWITCHOVER_TO }}"
  gather_facts: no
  become: yes
  become_method: sudo

  tasks:
    # -----------------------------------------------------------------
    # TASK 1.1 CHECK POWERHA CLUSTER MANAGER STATE
    # -----------------------------------------------------------------
    - name: Cluster Check - Query PowerHA Cluster Manager State
      shell: "lssrc -ls clstrmgrES | grep -i state"
      register: raw_clstrmgr
      changed_when: false
      failed_when: false

    # -----------------------------------------------------------------
    # TASK 1.2 CHECK DAEMON SUBSYSTEMS (clcomd, inetd, caa, cluster)
    # -----------------------------------------------------------------
    - name: Cluster Check - Query Core Daemon Subsystems
      shell: |
        echo "=== CLCOMD ===" && lssrc -s clcomd
        echo "=== INETD ==="  && lssrc -s inetd
        echo "=== CAA ==="    && lssrc -g caa
        echo "=== HA ==="     && lssrc -g cluster
      register: raw_cluster_daemons
      changed_when: false
      failed_when: false

    # -----------------------------------------------------------------
    # TASK 1.3 REGISTER CLUSTER FACTS FOR EMAIL REPORTING
    # -----------------------------------------------------------------
    - name: Cluster Check - Register Node Readiness Facts
      set_fact:
        chk_cluster_state: "{{ raw_clstrmgr.stdout | default('UNKNOWN') | trim }}"
        chk_cluster_daemons_ok: >-
          {{
            ('clcomd' in raw_cluster_daemons.stdout) and
            ('inetd' in raw_cluster_daemons.stdout) and
            ('caa' in raw_cluster_daemons.stdout) and
            ('cluster' in raw_cluster_daemons.stdout) and
            (raw_cluster_daemons.stdout.count('active') >= 4)
          }}
        chk_cluster_status_label: >-
          {% if 'ST_STABLE' in raw_clstrmgr.stdout and ('active' in raw_cluster_daemons.stdout) %}
            ACTIVE (ST_STABLE)
          {% elif 'ST_INIT' in raw_clstrmgr.stdout %}
            STOPPED (ST_INIT)
          {% else %}
            DEGRADED / UNKNOWN
          {% endif %}

    # Optional debug to verify collected facts per host during development
    - name: Cluster Check - Audit Fact Summary
      debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Cluster State: {{ chk_cluster_state }}"
          - "Cluster Status Label: {{ chk_cluster_status_label }}"



# =================================================================
# TASK 2 - MQ CLUSTER QUEUE VALIDATION (App Nodes Only)
# =================================================================
- name: Stage 00 - MQ Cluster Queue Check (App Nodes 1 & 2)
  hosts: "{{ SWITCHOVER_FROM }}_app:{{ SWITCHOVER_TO }}_app"
  gather_facts: no
  become: yes
  become_method: sudo
  become_user: "{{ app_user }}"  # e.g., sfmspadl301 / sfmspadl302

  vars:
    # List of 7 mandatory cluster queues required across all QMs
    required_cluster_queues:
      - "CPR.INCOMING"
      - "QPX.INCOMING"
      - "RBIH0000000"
      - "RBISPADBRQ"
      - "RBISPADBRO"
      - "SFMS.INCOMING"
      - "SFMS.INCOMING"

  tasks:
    # -----------------------------------------------------------------
    # TASK 2.1 QUERY QUEUE CLUSTER STATUS FOR EACH HOST QM
    # -----------------------------------------------------------------
    - name: MQ - Query Cluster Queues via runmqsc
      shell: |
        echo "dis qc(*)" | runmqsc {{ item }}
      loop: "{{ target_qms }}"
      register: raw_mqsc_results
      changed_when: false
      failed_when: false

    # -----------------------------------------------------------------
    # TASK 2.2 EVALUATE QUEUES AND REGISTER REPORT FACTS
    # -----------------------------------------------------------------
    - name: MQ - Parse Queue Results and Register Readiness Facts
      set_fact:
        chk_mq_results: >-
          {% set mq_report = [] %}
          {% for res in raw_mqsc_results.results %}
            {% set qm_name = res.item %}
            {% set stdout_text = res.stdout | default('') %}
            {% set found_count = stdout_text.splitlines() | select('search', 'TYPE\(QCLUSTER\)') | list | length %}
            {% set qm_status = 'PASS' if found_count >= 7 else 'FAIL (Found ' ~ found_count ~ '/7 Queues)' %}
            {% set _ = mq_report.append({
                'qm': qm_name,
                'status': qm_status,
                'queues_found': found_count
            }) %}
          {% endfor %}
          {{ mq_report }}

    # -----------------------------------------------------------------
    # TASK 2.3 AGGREGATE INTO CONSOLIDATED NODE SUMMARY FACT
    # -----------------------------------------------------------------
    - name: MQ - Build Node-Level Summary String
      set_fact:
        node_mq_summary: >-
          {% set status_list = [] %}
          {% for item in chk_mq_results %}
            {% set _ = status_list.append(item.qm ~ ': ' ~ item.status) %}
          {% endfor %}
          {{ status_list | join(' | ') }}

    - name: MQ - Audit Fact Output
      debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "MQ Check Output: {{ node_mq_summary }}"


# =================================================================
# TASK 3 - Curedepth Check on Node1 and Node2
# =================================================================

#############################################
# PLAY 3,1 NODE_1 PRE-CHECKS
#############################################
- name: PAD Node 1 - Pre-check MQ and Processes
  hosts: "{{ SWITCHOVER_FROM }}_app_node1:{{ SWITCHOVER_TO }}_app_node1"
  gather_facts: no
  become: yes
  become_method: sudo
  become_user: mqm
  vars:
    ansible_become_flags: "-H -S"
    ansible_ssh_pipelining: true
    mqm_binary: /usr/mqm/bin
  tasks:
    - name: Node 1 - Check MQ Queue Depths
      shell: "echo 'dis ql({{ item.queue }})  curdepth' | {{ mqm_binary }}/runmqsc {{ item.qmgr }}"
      loop: "{{ mq_check_matrix_n1 }}"
      register: mq_node1
      ignore_errors: yes

#############################################
# PLAY 3.2 NODE_2 PRE-CHECKS
#############################################
- name: PAD Node 2 - Pre-check MQ and Processes
  hosts: "{{ SWITCHOVER_FROM }}_app_node2:{{ SWITCHOVER_TO }}_app_node2"
  gather_facts: no
  become: yes
  become_method: sudo
  become_user: mqm
  vars:
    ansible_become_flags: "-H -S"
    ansible_ssh_pipelining: true
    mqm_binary: /usr/mqm/bin
  tasks:
    - name: Node 2 - Check MQ Queue Depths
      shell: "echo 'dis ql({{ item.queue }}) curdepth' | {{ mqm_binary }}/runmqsc {{ item.qmgr }}"
      loop: "{{ mq_check_matrix_n2 }}"
      register: mq_node2
      ignore_errors: yes