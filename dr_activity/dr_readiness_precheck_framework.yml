[root@gitserver dr_activity]# cat dr_readiness_framework_precheck.yml
---
# =================================================================
# TASK 1 - DR READINESS PRE-CHECK FRAMEWORK (All 8 Nodes)
# =================================================================
- name: Stage 00 - AIX PowerHA Cluster Readiness Check (All 8 Nodes)
  hosts: "{{ SWITCHOVER_FROM }}:{{ SWITCHOVER_TO }}"
  gather_facts: no
#  become: yes
  become_method: sudo
  vars:
    ansible_become_flags: "-H -S"
    ansible_ssh_pipelining: true

  tasks:
    # -----------------------------------------------------------------
    # TASK 1.1 CHECK POWERHA CLUSTER MANAGER STATE
    # -----------------------------------------------------------------
    - name: Cluster Check - Query PowerHA Cluster Manager State
      shell: "lssrc -ls clstrmgrES | grep -i state"
      register: raw_clstrmgr
      changed_when: false
      failed_when: false

    # -----------------------------------------------------------------
    # TASK 1.2 CHECK DAEMON SUBSYSTEMS (clcomd, inetd, caa, cluster)
    # -----------------------------------------------------------------
    - name: Cluster Check - Query Core Daemon Subsystems
      shell: |
        echo "=== CLCOMD ===" && lssrc -s clcomd
        echo "=== INETD ==="  && lssrc -s inetd
        echo "=== CAA ==="    && lssrc -g caa
        echo "=== HA ==="     && lssrc -g cluster
      register: raw_cluster_daemons
      changed_when: false
      failed_when: false

    # -----------------------------------------------------------------
    # TASK 1.3 REGISTER CLUSTER FACTS FOR EMAIL REPORTING
    # -----------------------------------------------------------------
    - name: Cluster Check - Register Node Readiness Facts
      set_fact:
        chk_cluster_state: "{{ raw_clstrmgr.stdout | default('UNKNOWN') | trim }}"
        chk_cluster_daemons_ok: >-
          {{
            ('clcomd' in raw_cluster_daemons.stdout) and
            ('inetd' in raw_cluster_daemons.stdout) and
            ('caa' in raw_cluster_daemons.stdout) and
            ('cluster' in raw_cluster_daemons.stdout) and
            (raw_cluster_daemons.stdout.count('active') >= 4)
          }}
        chk_cluster_status_label: >-
          {% if 'ST_STABLE' in raw_clstrmgr.stdout and ('active' in raw_cluster_daemons.stdout) %}
            ACTIVE (ST_STABLE)
          {% elif 'ST_INIT' in raw_clstrmgr.stdout %}
            STOPPED (ST_INIT)
          {% else %}
            DEGRADED / UNKNOWN
          {% endif %}

    - name: Cluster Check - Audit Fact Summary
      debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Cluster State: {{ chk_cluster_state }}"
          - "Cluster Status Label: {{ chk_cluster_status_label }}"


# =================================================================
# TASK 2 - MQ CLUSTER QUEUE VALIDATION (App Nodes Only)
# =================================================================
- name: Stage 00 - MQ Cluster Queue Check (App Nodes 1 & 2)
  hosts: "{{ SWITCHOVER_FROM }}_app:{{ SWITCHOVER_TO }}_app"
  gather_facts: no

  vars:
    ansible_become_flags: "-H -S"
    ansible_ssh_pipelining: true
    mqm_binary: "/usr/mqm/bin"
    required_cluster_queues:
      - "CPR.INCOMING"
      - "QPX.INCOMING"
      - "RBIH0000000"
      - "RBISPADBRQ"
      - "RBISPADBRO"
      - "SFMS.INCOMING"

  tasks:

    # ----------------------------------------------------
    # DYNAMIC ENV EXTRACTION BLOCK ON NODE 1
    # ----------------------------------------------------

    - name: Node 1 - Read the env file from tmp dir
      slurp:
        src: "/tmp/node1_env.txt"
      register: node1_env_raw

    - name: Node 1 - Display vars
      debug:
        msg: "{{ (node1_env_raw.content | b64decode).splitlines() }}"


    - name: Node 1 - Convert environment to dictionary
      ansible.builtin.set_fact:
        node1_env: >-
          {{
            dict(
              (node1_env_raw.content | b64decode).splitlines()
              | map('trim')
              | select('match', '^[A-Za-z_][A-Za-z0-9_]*=')
              | reject('match', '^BASH_FUNC_')
              | map('split', '=', 1)
            )
          }}



    # -----------------------------------------------------------------
    # TASK 2.1a: NODE 1 - QUERY CLUSTER QUEUES VIA RUNMQSC
    # -----------------------------------------------------------------
    - name: Node 1 - MQ - Query Cluster Queues via runmqsc
      shell: |
        echo "dis qc(*)" | {{ mqm_binary }}/runmqsc {{ item }}
      loop: "{{ [node1_qmgr, gateway_qmgr] }}"
      become: yes
      become_method: sudo
      become_user: "{{ node1_user }}"
      environment: "{{ node1_env }}"
      register: raw_mqsc_results_n1
      changed_when: false
      failed_when: false
      when: "'node1' in inventory_hostname or 'node1' in group_names | join(' ')"



    # ----------------------------------------------------
    # DYNAMIC ENV EXTRACTION BLOCK ON NODE 2
    # ----------------------------------------------------

    - name: Node 2 - Read the env file from tmp dir
      slurp:
        src: "/tmp/node2_env.txt"
      register: node2_env_raw

    - name: Node 2 - Display vars
      debug:
        msg: "{{ (node2_env_raw.content | b64decode).splitlines() }}"


    - name: Node 2 - Convert environment to dictionary
      ansible.builtin.set_fact:
        node2_env: >-
          {{
            dict(
              (node2_env_raw.content | b64decode).splitlines()
              | map('trim')
              | select('match', '^[A-Za-z_][A-Za-z0-9_]*=')
              | reject('match', '^BASH_FUNC_')
              | map('split', '=', 1)
            )
          }}


    # -----------------------------------------------------------------
    # TASK 2.1b: NODE 2 - QUERY CLUSTER QUEUES VIA RUNMQSC
    # -----------------------------------------------------------------
    - name: Node 2 - MQ - Query Cluster Queues via runmqsc
      shell: |
        echo "dis qc(*)" | {{ mqm_binary }}/runmqsc {{ item }}
      loop: "{{ [node2_qmgr] }}"
      become: yes
      become_method: sudo
      become_user: "{{ node2_user }}"
      environment: "{{ node2_env }}"
      register: raw_mqsc_results_n2
      changed_when: false
      failed_when: false
      when: "'node2' in inventory_hostname or 'node2' in group_names | join(' ')"


    # -----------------------------------------------------------------
    # TASK 2.2: UNIFY RAW RESULTS ACROSS NODES
    # -----------------------------------------------------------------
    - name: MQ - Consolidate Raw Execution Results
      set_fact:
        raw_mqsc_results: >-
          {{
            raw_mqsc_results_n1
            if (
              raw_mqsc_results_n1 is defined
              and raw_mqsc_results_n1.results is defined
              and (
                raw_mqsc_results_n1.results
                | selectattr('skipped', 'undefined')
                | list
                | length
              ) > 0
            )
            else raw_mqsc_results_n2
          }}

    - name: MQ - Verify Consolidated Raw Results
      debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Raw MQ result type: {{ raw_mqsc_results | type_debug }}"
          - "Number of MQ results: {{ raw_mqsc_results.results | default([]) | length }}"


    # -----------------------------------------------------------------
    # TASK 2.3: EVALUATE QUEUES AND REGISTER READINESS FACTS
    # -----------------------------------------------------------------
    - name: MQ - Initialize Queue Validation Results
      set_fact:
        chk_mq_results: []

    - name: MQ - Process Queue Manager Status
      set_fact:
        chk_mq_results: >-
          {{
            chk_mq_results + [{
              'qm': item.item,
              'status': ('PASS' if ((item.stdout_lines | default([]) | select('search', 'TYPE\(QCLUSTER\)') | list | length) >= 7) else ('FAIL (Found ' ~ (item.stdout_lines | default([]) | select('search','TYPE(QCLUSTER)')| list | length) ~ '/7 Queues)')),
              'queues_found': (item.stdout_lines | default('') | select('search','TYPE(QCLUSTER)')| list | length),
              'required_queues': 7
            }]
          }}
      loop: "{{ raw_mqsc_results.results | default([]) }}"
      when:
        - item.stdout is defined
        - not (item.skipped | default(false))



    - name: MQ - Audit Processed Queue Results
      debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Queue Manager: {{ item.qm }}"
          - "Status: {{ item.status }}"
          - "Queues Found: {{ item.queues_found }}/{{ item.required_queues }}"
      loop: "{{ chk_mq_results }}"


    # -----------------------------------------------------------------
    # TASK 2.4: AGGREGATE INTO CONSOLIDATED NODE SUMMARY STRING
    # -----------------------------------------------------------------
    - name: MQ - Build Node-Level Summary String
      set_fact:
        node_mq_summary: >-
          {{
            chk_mq_results
            | map(attribute='qm')
            | zip(chk_mq_results | map(attribute='status'))
            | map('join', ': ')
            | join(' | ')
          }}


    - name: MQ - Audit Fact Output
      debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "MQ Check Output: {{ node_mq_summary }}"
          - "Detailed MQ Results: {{ chk_mq_results }}"



# =================================================================
# TASK 3 - CURDEPTH CHECK ON NODE 1 AND NODE 2 (App Nodes Only)
# =================================================================

# -----------------------------------------------------------------
# TASK 3.1 NODE 1 PRE-CHECKS
# -----------------------------------------------------------------
- name: PAD Node 1 - Pre-check MQ Queue Depths
  hosts: "{{ SWITCHOVER_FROM }}_app_node1:{{ SWITCHOVER_TO }}_app_node1"
  gather_facts: no
  become: yes
  become_method: sudo
  become_user: mqm
  vars:
    ansible_become_flags: "-H -S"
    ansible_ssh_pipelining: true
    mqm_binary: /usr/mqm/bin
  tasks:
    - name: Node 1 - Check MQ Queue Depths
      shell: "echo 'dis ql({{ item.queue }}) curdepth' | {{ mqm_binary }}/runmqsc {{ item.qmgr }}"
      loop: "{{ mq_check_matrix_n1 }}"
      register: mq_node1
      ignore_errors: yes

# -----------------------------------------------------------------
# TASK 3.2 NODE 2 PRE-CHECKS
# -----------------------------------------------------------------
- name: PAD Node 2 - Pre-check MQ Queue Depths
  hosts: "{{ SWITCHOVER_FROM }}_app_node2:{{ SWITCHOVER_TO }}_app_node2"
  gather_facts: no
  become: yes
  become_method: sudo
  become_user: mqm
  vars:
    ansible_become_flags: "-H -S"
    ansible_ssh_pipelining: true
    mqm_binary: /usr/mqm/bin
  tasks:
    - name: Node 2 - Check MQ Queue Depths
      shell: "echo 'dis ql({{ item.queue }}) curdepth' | {{ mqm_binary }}/runmqsc {{ item.qmgr }}"
      loop: "{{ mq_check_matrix_n2 }}"
      register: mq_node2
      ignore_errors: yes




# -----------------------------------------------------------------
# TASK 4 REMOTE QUEUE PRECHECKS
# -----------------------------------------------------------------
- name: PAD Node  - Check Remote queues
  hosts: "{{ SWITCHOVER_FROM }}_app_node1:{{ SWITCHOVER_TO }}_app_node1"
  gather_facts: no
  become: yes
  become_method: sudo
  become_user: mqm
  vars:
    ansible_become_flags: "-H -S"
    ansible_ssh_pipelining: true
    mqm_binary: /usr/mqm/bin

  tasks:

    - name: Fetch Remote Queue Details (SFMSRBIPADGWQM) on App Node 1
      shell: |
        echo "dis qr(CPR.INCOMING) RNAME RQMNAME" | {{ mqm_binary }}/runmqsc SFMSRBIPADGWQM
        echo "dis qr(QPX.INCOMING) RNAME RQMNAME" | {{ mqm_binary }}/runmqsc SFMSRBIPADGWQM
        echo "dis qr(RBIH0000000) RNAME RQMNAME" | {{ mqm_binary }}/runmqsc SFMSRBIPADGWQM
      register: mq_rqm_raw
      failed_when: false
      become_method: sudo
      become_user: "{{ node1_user }}"


    - name: Parse Remote Queue Details into Facts
      set_fact:
        remote_q_facts:
          - qname: "CPR.INCOMING"
            rqmname: "{{ (mq_rqm_raw.stdout | regex_search('QUEUE\\(CPR\\.INCOMING\\)[\\s\\S]*?RQMNAME\\(([^\\)]+)\\)', '\\1') | default(['N/A']))[0] }}"
            rname: "{{ (mq_rqm_raw.stdout | regex_search('QUEUE\\(CPR\\.INCOMING\\)[\\s\\S]*?RNAME\\(([^\\)]+)\\)', '\\1') | default(['N/A']))[0] }}"
          - qname: "QPX.INCOMING"
            rqmname: "{{ (mq_rqm_raw.stdout | regex_search('QUEUE\\(QPX\\.INCOMING\\)[\\s\\S]*?RQMNAME\\(([^\\)]+)\\)', '\\1') | default(['N/A']))[0] }}"
            rname: "{{ (mq_rqm_raw.stdout | regex_search('QUEUE\\(QPX\\.INCOMING\\)[\\s\\S]*?RNAME\\(([^\\)]+)\\)', '\\1') | default(['N/A']))[0] }}"
          - qname: "RBIH0000000"
            rqmname: "{{ (mq_rqm_raw.stdout | regex_search('QUEUE\\(RBIH0000000\\)[\\s\\S]*?RQMNAME\\(([^\\)]+)\\)', '\\1') | default(['N/A']))[0] }}"
            rname: "{{ (mq_rqm_raw.stdout | regex_search('QUEUE\\(RBIH0000000\\)[\\s\\S]*?RNAME\\(([^\\)]+)\\)', '\\1') | default(['N/A']))[0] }}"



# =================================================================
# TASK - CONSOLIDATED REPORTING & EMAIL VARIABLE GENERATION
# =================================================================
- name: Generate Consolidated DR Readiness Email Body Variable
  hosts: localhost
  gather_facts: no

  tasks:
    - name: Compile Master HTML Email Body Fact
      set_fact:
        dr_readiness_email_body: |
          <html>
          <head>
          <style>
            body { font-family: Arial, sans-serif; font-size: 14px; color: #333; }
            table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
            th, td { border: 1px solid #dddddd; text-align: left; padding: 8px; }
            th { background-color: #003366; color: white; }
            tr:nth-child(even) { background-color: #f2f2f2; }
            .pass { color: green; font-weight: bold; }
            .fail { color: red; font-weight: bold; }
            .header-bg { background-color: #e6f2ff; font-weight: bold; }
          </style>
          </head>
          <body>
          <h2>🚀 SFMS DR Readiness Pre-flight Assessment Report</h2>
          <p><b>Execution Scope:</b> Switchover FROM <b>{{ SWITCHOVER_FROM | upper }}</b> TO <b>{{ SWITCHOVER_TO | upper }}</b></p>

          <h3>1. PowerHA Cluster Status (All 8 Nodes)</h3>
          <table>
            <tr>
              <th>Node Hostname</th>
              <th>Cluster Manager State</th>
              <th>Overall Cluster Readiness</th>
            </tr>
            {% for host in (groups[SWITCHOVER_FROM] + groups[SWITCHOVER_TO]) | unique %}
            <tr>
              <td><b>{{ host }}</b></td>
              <td>{{ hostvars[host].chk_cluster_state | default('N/A') }}</td>
              <td>
                {% set status = hostvars[host].chk_cluster_status_label | default('UNKNOWN') %}
                <span class="{{ 'pass' if 'ACTIVE' in status else 'fail' }}">{{ status }}</span>
              </td>
            </tr>
            {% endfor %}
          </table>

          <h3>2. MQ Cluster Queues Health (App Nodes)</h3>
          <table>
            <tr>
              <th>Node Hostname</th>
              <th>Queue Manager Cluster Status</th>
            </tr>
            {% for host in (groups[SWITCHOVER_FROM + '_app'] + groups[SWITCHOVER_TO + '_app']) | unique %}
            <tr>
              <td><b>{{ host }}</b></td>
              <td>{{ hostvars[host].node_mq_summary | default('N/A') }}</td>
            </tr>
            {% endfor %}
          </table>

          <h3>3. Monitored Queue Depth (Curdepth) Verification</h3>
          <table>
            <tr>
              <th>Node Hostname</th>
              <th>Queue Manager</th>
              <th>Queue Name</th>
              <th>Curdepth Status</th>
            </tr>

            {# -------------------------------------------------------------
               NODE 1 RESULTS
               ------------------------------------------------------------- #}

            {% for host in (
                  groups[SWITCHOVER_FROM + '_app_node1']
                  + groups[SWITCHOVER_TO + '_app_node1']
                ) | unique %}

              {% set mq_res = hostvars[host].mq_node1 | default({}) %}

              {% if mq_res.results is defined %}

                {% for item in mq_res.results %}

                  {% set depth_match = item.stdout | default('') | regex_search('CURDEPTH\\((\\d+)\\)', '\\1') %}
                  {% set depth = depth_match[0] if depth_match else '0' %}

                  <tr>
                    <td><b>{{ host }}</b></td>
                    <td>{{ item.item.qmgr }}</td>
                    <td>{{ item.item.queue }}</td>
                    <td class="{{ 'pass' if depth == '0' else 'fail' }}">
                      {{ '🟢 CLEAR (0)' if depth == '0' else '🔴 BLOCKED (' ~ depth ~ ')' }}
                    </td>
                  </tr>

                {% endfor %}

              {% endif %}

            {% endfor %}


            {# -------------------------------------------------------------
               NODE 2 RESULTS
               ------------------------------------------------------------- #}

            {% for host in (
                  groups[SWITCHOVER_FROM + '_app_node2']
                  + groups[SWITCHOVER_TO + '_app_node2']
                ) | unique %}

              {% set mq_res = hostvars[host].mq_node2 | default({}) %}

              {% if mq_res.results is defined %}

                {% for item in mq_res.results %}

                  {% set depth_match = item.stdout | default('') | regex_search('CURDEPTH\\((\\d+)\\)', '\\1') %}
                  {% set depth = depth_match[0] if depth_match else '0' %}

                  <tr>
                    <td><b>{{ host }}</b></td>
                    <td>{{ item.item.qmgr }}</td>
                    <td>{{ item.item.queue }}</td>
                    <td class="{{ 'pass' if depth == '0' else 'fail' }}">
                      {{ '🟢 CLEAR (0)' if depth == '0' else '🔴 BLOCKED (' ~ depth ~ ')' }}
                    </td>
                  </tr>

                {% endfor %}

              {% endif %}

            {% endfor %}
          </table>

          <h3>4. MQ Remote Queues Details (SFMSRBIPADGWQM)</h3>
            <table>
              <tr>
                <th>Node Hostname</th>
                <th>Queue Name</th>
                <th>Type</th>
                <th>RQMNAME</th>
                <th>RNAME</th>
              </tr>
              {% for host in [groups[SWITCHOVER_FROM + '_app_node1'][0], groups[SWITCHOVER_TO + '_app_node1'][0]] %}
                {% if hostvars[host].remote_q_facts is defined %}
                  {% for q in hostvars[host].remote_q_facts %}
                  <tr>
                    <td>{{ host }}</td>
                    <td>{{ q.qname }}</td>
                    <td>QREMOTE</td>
                    <td>{{ q.rqmname }}</td>
                    <td>{{ q.rname }}</td>
                  </tr>
                  {% endfor %}
                {% endif %}
              {% endfor %}
            </table>
          <br/>
          </body>
          </html>

    - name: Output Variable Contents to Console (Verification)
      debug:
        var: dr_readiness_email_body



    - name: Send consolidated Summary Email
      community.general.mail:
        host: 10.35.1.17
        port: 25
        to: "{{ email_recepients | join(', ') }}"
        from: ansible.alerts@rbi.org.in
        subject: "DR READINESS FRAMEWORK EXECUTION"
        body: "{{ dr_readiness_email_body }}"
        subtype: html
      delegate_to: localhost
      run_once: true