---
# =================================================================
# TASK 1 - DR READINESS PRE-CHECK FRAMEWORK (All 8 Nodes)
# =================================================================
- name: Stage 00 - AIX PowerHA Cluster Readiness Check (All 8 Nodes)
  hosts: "{{ SWITCHOVER_FROM }}:{{ SWITCHOVER_TO }}"
  gather_facts: no
  become: yes
  become_method: sudo

  tasks:
    # -----------------------------------------------------------------
    # TASK 1.1 CHECK POWERHA CLUSTER MANAGER STATE
    # -----------------------------------------------------------------
    - name: Cluster Check - Query PowerHA Cluster Manager State
      shell: "lssrc -ls clstrmgrES | grep -i state"
      register: raw_clstrmgr
      changed_when: false
      failed_when: false

    # -----------------------------------------------------------------
    # TASK 1.2 CHECK DAEMON SUBSYSTEMS (clcomd, inetd, caa, cluster)
    # -----------------------------------------------------------------
    - name: Cluster Check - Query Core Daemon Subsystems
      shell: |
        echo "=== CLCOMD ===" && lssrc -s clcomd
        echo "=== INETD ==="  && lssrc -s inetd
        echo "=== CAA ==="    && lssrc -g caa
        echo "=== HA ==="     && lssrc -g cluster
      register: raw_cluster_daemons
      changed_when: false
      failed_when: false

    # -----------------------------------------------------------------
    # TASK 1.3 REGISTER CLUSTER FACTS FOR EMAIL REPORTING
    # -----------------------------------------------------------------
    - name: Cluster Check - Register Node Readiness Facts
      set_fact:
        chk_cluster_state: "{{ raw_clstrmgr.stdout | default('UNKNOWN') | trim }}"
        chk_cluster_daemons_ok: >-
          {{
            ('clcomd' in raw_cluster_daemons.stdout) and
            ('inetd' in raw_cluster_daemons.stdout) and
            ('caa' in raw_cluster_daemons.stdout) and
            ('cluster' in raw_cluster_daemons.stdout) and
            (raw_cluster_daemons.stdout.count('active') >= 4)
          }}
        chk_cluster_status_label: >-
          {% if 'ST_STABLE' in raw_clstrmgr.stdout and ('active' in raw_cluster_daemons.stdout) %}
            ACTIVE (ST_STABLE)
          {% elif 'ST_INIT' in raw_clstrmgr.stdout %}
            STOPPED (ST_INIT)
          {% else %}
            DEGRADED / UNKNOWN
          {% endif %}

    - name: Cluster Check - Audit Fact Summary
      debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Cluster State: {{ chk_cluster_state }}"
          - "Cluster Status Label: {{ chk_cluster_status_label }}"


# =================================================================
# TASK 2 - MQ CLUSTER QUEUE VALIDATION (App Nodes Only)
# =================================================================
- name: Stage 00 - MQ Cluster Queue Check (App Nodes 1 & 2)
  hosts: "{{ SWITCHOVER_FROM }}_app:{{ SWITCHOVER_TO }}_app"
  gather_facts: no
  become: yes
  become_method: sudo
  become_user: "{{ app_user }}"

  vars:
    required_cluster_queues:
      - "CPR.INCOMING"
      - "QPX.INCOMING"
      - "RBIH0000000"
      - "RBISPADBRQ"
      - "RBISPADBRO"
      - "SFMS.INCOMING"
      - "SFMS.INCOMING"

  tasks:
    # -----------------------------------------------------------------
    # TASK 2.1 QUERY QUEUE CLUSTER STATUS FOR EACH HOST QM
    # -----------------------------------------------------------------
    - name: MQ - Query Cluster Queues via runmqsc
      shell: |
        echo "dis qc(*)" | runmqsc {{ item }}
      loop: "{{ target_qms }}"
      register: raw_mqsc_results
      changed_when: false
      failed_when: false

    # -----------------------------------------------------------------
    # TASK 2.2 EVALUATE QUEUES AND REGISTER REPORT FACTS
    # -----------------------------------------------------------------
    - name: MQ - Parse Queue Results and Register Readiness Facts
      set_fact:
        chk_mq_results: >-
          {% set mq_report = [] %}
          {% for res in raw_mqsc_results.results %}
            {% set qm_name = res.item %}
            {% set stdout_text = res.stdout | default('') %}
            {% set found_count = stdout_text.splitlines() | select('search', 'TYPE\(QCLUSTER\)') | list | length %}
            {% set qm_status = 'PASS' if found_count >= 7 else 'FAIL (Found ' ~ found_count ~ '/7 Queues)' %}
            {% set _ = mq_report.append({
                'qm': qm_name,
                'status': qm_status,
                'queues_found': found_count
            }) %}
          {% endfor %}
          {{ mq_report }}

    # -----------------------------------------------------------------
    # TASK 2.3 AGGREGATE INTO CONSOLIDATED NODE SUMMARY FACT
    # -----------------------------------------------------------------
    - name: MQ - Build Node-Level Summary String
      set_fact:
        node_mq_summary: >-
          {% set status_list = [] %}
          {% for item in chk_mq_results %}
            {% set _ = status_list.append(item.qm ~ ': ' ~ item.status) %}
          {% endfor %}
          {{ status_list | join(' | ') }}

    - name: MQ - Audit Fact Output
      debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "MQ Check Output: {{ node_mq_summary }}"


# =================================================================
# TASK 3 - CURDEPTH CHECK ON NODE 1 AND NODE 2 (App Nodes Only)
# =================================================================

# -----------------------------------------------------------------
# TASK 3.1 NODE 1 PRE-CHECKS
# -----------------------------------------------------------------
- name: PAD Node 1 - Pre-check MQ Queue Depths
  hosts: "{{ SWITCHOVER_FROM }}_app_node1:{{ SWITCHOVER_TO }}_app_node1"
  gather_facts: no
  become: yes
  become_method: sudo
  become_user: mqm
  vars:
    ansible_become_flags: "-H -S"
    ansible_ssh_pipelining: true
    mqm_binary: /usr/mqm/bin
  tasks:
    - name: Node 1 - Check MQ Queue Depths
      shell: "echo 'dis ql({{ item.queue }}) curdepth' | {{ mqm_binary }}/runmqsc {{ item.qmgr }}"
      loop: "{{ mq_check_matrix_n1 }}"
      register: mq_node1
      ignore_errors: yes

# -----------------------------------------------------------------
# TASK 3.2 NODE 2 PRE-CHECKS
# -----------------------------------------------------------------
- name: PAD Node 2 - Pre-check MQ Queue Depths
  hosts: "{{ SWITCHOVER_FROM }}_app_node2:{{ SWITCHOVER_TO }}_app_node2"
  gather_facts: no
  become: yes
  become_method: sudo
  become_user: mqm
  vars:
    ansible_become_flags: "-H -S"
    ansible_ssh_pipelining: true
    mqm_binary: /usr/mqm/bin
  tasks:
    - name: Node 2 - Check MQ Queue Depths
      shell: "echo 'dis ql({{ item.queue }}) curdepth' | {{ mqm_binary }}/runmqsc {{ item.qmgr }}"
      loop: "{{ mq_check_matrix_n2 }}"
      register: mq_node2
      ignore_errors: yes


# =================================================================
# TASK 4 - CONSOLIDATED REPORTING & EMAIL VARIABLE GENERATION
# =================================================================
- name: Generate Consolidated DR Readiness Email Body Variable
  hosts: localhost
  gather_facts: no

  tasks:
    - name: Compile Master HTML Email Body Fact
      set_fact:
        dr_readiness_email_body: |
          <html>
          <head>
          <style>
            body { font-family: Arial, sans-serif; font-size: 14px; color: #333; }
            table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
            th, td { border: 1px solid #dddddd; text-align: left; padding: 8px; }
            th { background-color: #003366; color: white; }
            tr:nth-child(even) { background-color: #f2f2f2; }
            .pass { color: green; font-weight: bold; }
            .fail { color: red; font-weight: bold; }
            .header-bg { background-color: #e6f2ff; font-weight: bold; }
          </style>
          </head>
          <body>
          <h2>🚀 SFMS DR Readiness Pre-flight Assessment Report</h2>
          <p><b>Execution Scope:</b> Switchover FROM <b>{{ SWITCHOVER_FROM | upper }}</b> TO <b>{{ SWITCHOVER_TO | upper }}</b></p>
          
          <h3>1. PowerHA Cluster Status (All 8 Nodes)</h3>
          <table>
            <tr>
              <th>Node Hostname</th>
              <th>Cluster Manager State</th>
              <th>Overall Cluster Readiness</th>
            </tr>
            {% for host in (groups[SWITCHOVER_FROM] + groups[SWITCHOVER_TO]) | unique %}
            <tr>
              <td><b>{{ host }}</b></td>
              <td>{{ hostvars[host].chk_cluster_state | default('N/A') }}</td>
              <td>
                {% set status = hostvars[host].chk_cluster_status_label | default('UNKNOWN') %}
                <span class="{{ 'pass' if 'ACTIVE' in status else 'fail' }}">{{ status }}</span>
              </td>
            </tr>
            {% endfor %}
          </table>

          <h3>2. MQ Cluster Queues Health (App Nodes)</h3>
          <table>
            <tr>
              <th>Node Hostname</th>
              <th>Queue Manager Cluster Status</th>
            </tr>
            {% for host in (groups[SWITCHOVER_FROM + '_app'] + groups[SWITCHOVER_TO + '_app']) | unique %}
            <tr>
              <td><b>{{ host }}</b></td>
              <td>{{ hostvars[host].node_mq_summary | default('N/A') }}</td>
            </tr>
            {% endfor %}
          </table>

          <h3>3. Monitored Queue Depth (Curdepth) Verification</h3>
          <table>
            <tr>
              <th>Node Hostname</th>
              <th>Queue Manager</th>
              <th>Queue Name</th>
              <th>Curdepth Status</th>
            </tr>
            {% for host in (groups[SWITCHOVER_FROM + '_app_node1'] + groups[SWITCHOVER_TO + '_app_node1'] + groups[SWITCHOVER_FROM + '_app_node2'] + groups[SWITCHOVER_TO + '_app_node2']) | unique %}
              {% set mq_res = hostvars[host].mq_node1 if 'node1' in host else hostvars[host].mq_node2 %}
              {% if mq_res is defined and mq_res.results is defined %}
                {% for item in mq_res.results %}
                  {% set depth_match = item.stdout | default('') | regex_search('CURDEPTH\\((\\d+)\\)', '\\1') %}
                  {% set depth = depth_match[0] if depth_match else '0' %}
                  <tr>
                    <td><b>{{ host }}</b></td>
                    <td>{{ item.item.qmgr }}</td>
                    <td>{{ item.item.queue }}</td>
                    <td class="{{ 'pass' if depth == '0' else 'fail' }}">
                      {{ '🟢 CLEAR (0)' if depth == '0' else '🔴 BLOCKED (' ~ depth ~ ')' }}
                    </td>
                  </tr>
                {% endfor %}
              {% endif %}
            {% endfor %}
          </table>

          <br/>
          <p><i>Note: This is an automatically generated readiness check report from Ansible Automation Platform.</i></p>
          </body>
          </html>

    - name: Output Variable Contents to Console (Verification)
      debug:
        var: dr_readiness_email_body