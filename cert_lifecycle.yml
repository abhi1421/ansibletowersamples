---
- name: Certinext Certificate Lifecycle Automation - Phase 1
  hosts: localhost
  connection: local

  vars:
    # --- AAP SURVEY INPUTS (Overridden dynamically in production by Survey extra_vars) ---
    cert_type: "{{ survey_cert_type | default('DV UCC') }}"
    common_name: "{{ survey_common_name | default('test.ngrtgs.rbi.org.in') }}"
    
    # Converts comma-separated text box input from Survey into a YAML list
    san_list: "{{ (survey_san_input | default('test.ngrtgs.rbi.org.in, dev.ngrtgs.rbi.org.in, uat.ngrtgs.rbi.org.in')).split(',') | map('trim') | list }}"

    # --- API & INFRASTRUCTURE CONFIGURATION ---
    certinext_api_url: "https://api.certinext.io"
    order_endpoint_path: "/orders"  # Update path once confirmed with customer API documentation
    client_id: "8459969524"
    client_secret: "3811358745f343b9a5cb3dfb3b6f2be3"
    support_email: "rbiportalsupport@rbi.org.in"

  tasks:
    # =========================================================================
    # PRE-PROCESSING & DIRECTORY SETUP (Non-workflow helper steps)
    # Creates a date-stamped folder structure to isolate runtime certificate artifacts
    # Path format: /tmp/certinext/YYYY-MM-DD/common_name/
    # =========================================================================
    - name: Get current date string
      ansible.builtin.set_fact:
        current_date: "{{ lookup('pipe', 'date +%Y-%m-%d') }}"

    - name: Define target folder path
      ansible.builtin.set_fact:
        output_dir: "/tmp/certinext/{{ current_date }}/{{ common_name }}"

    - name: Ensure target artifact directory exists
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: '0700'

    # =========================================================================
    # STEP 1: Get Bearer Token
    # Authenticates with the Certinext API via OAuth 2.0 Client Credentials
    # =========================================================================
    - name: Step 1 - Call Certinext API to get Bearer Token
      ansible.builtin.uri:
        url: "{{ certinext_api_url }}/oauth/token"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: "client_credentials"
          client_id: "{{ client_id }}"
          client_secret: "{{ client_secret }}"
        status_code: 200
      register: token_response

    - name: Set Auth Header Fact
      ansible.builtin.set_fact:
        auth_header: "Bearer {{ token_response.json.access_token }}"

    # =========================================================================
    # STEP 2: Pick the right Create - Variant (DV / DV Wildcard / DV UCC)
    # Generates local RSA key, creates CSR based on user inputs, and submits order
    # =========================================================================
    - name: Step 2a - Generate Private Key (RSA 2048) using OpenSSL
      ansible.builtin.command:
        cmd: "openssl genrsa -out {{ output_dir }}/{{ common_name }}.key 2048"
        creates: "{{ output_dir }}/{{ common_name }}.key"

    - name: Step 2b - Create OpenSSL Config file with SANs
      ansible.builtin.copy:
        dest: "{{ output_dir }}/openssl.cnf"
        content: |
          [ req ]
          default_bits       = 2048
          distinguished_name = req_distinguished_name
          req_extensions     = req_ext
          prompt             = no

          [ req_distinguished_name ]
          CN = {{ common_name }}

          [ req_ext ]
          subjectAltName = @alt_names

          [ alt_names ]
          {% for san in san_list %}
          DNS.{{ loop.index }} = {{ san }}
          {% endfor %}

    - name: Step 2c - Generate CSR File using OpenSSL
      ansible.builtin.command:
        cmd: >
          openssl req -new 
          -key {{ output_dir }}/{{ common_name }}.key 
          -out {{ output_dir }}/{{ common_name }}.csr 
          -config {{ output_dir }}/openssl.cnf
        creates: "{{ output_dir }}/{{ common_name }}.csr"

    - name: Step 2d - Read Generated Local CSR File
      ansible.builtin.slurp:
        src: "{{ output_dir }}/{{ common_name }}.csr"
      register: raw_csr

    - name: Step 2e - Submit Certificate Order to Certinext API
      ansible.builtin.uri:
        url: "{{ certinext_api_url }}{{ order_endpoint_path }}"
        method: POST
        headers:
          Authorization: "{{ auth_header }}"
          Content-Type: "application/json"
        body_format: json
        body:
          certificate_type: "{{ cert_type }}"
          common_name: "{{ common_name }}"
          sans: "{{ san_list }}"
          csr: "{{ raw_csr.content | b64decode }}"
        status_code: [200, 201]
      register: order_response
      ignore_errors: true  # Allows local lab execution while endpoint path is being confirmed

    - name: Set Order ID Fact
      ansible.builtin.set_fact:
        order_id: "{{ order_response.json.order_id | default('LAB_TEST_ORDER_12345') }}"

    # =========================================================================
    # STEP 3: Get DCV Challenges
    # Fetches the DNS TXT record challenge value required for domain verification
    # =========================================================================
    - name: Step 3 - Fetch TXT Record Challenge from API
      ansible.builtin.uri:
        url: "{{ certinext_api_url }}{{ order_endpoint_path }}/{{ order_id }}/dcv"
        method: GET
        headers:
          Authorization: "{{ auth_header }}"
        status_code: 200
      register: dcv_response
      ignore_errors: true

    # =========================================================================
    # STEP 4: Publish the TXT record / HTTP file / reply to email
    # Drafts consolidated body variable, saves local state, and emails support
    # =========================================================================
    - name: Step 4a - Construct Consolidated Email Body Variable
      ansible.builtin.set_fact:
        email_body_content: |
          Dear RBI Support Team,

          Please publish the following DNS TXT Record for Domain Control Validation (DCV):

          =====================================================
          REQUEST DETAILS
          =====================================================
          Common Name   : {{ common_name }}
          Cert Variant  : {{ cert_type }}
          Order ID      : {{ order_id }}

          =====================================================
          REQUIRED DNS TXT RECORD
          =====================================================
          Record Host   : _acme-challenge.{{ common_name }}
          Record Type   : TXT
          Record Value  : {{ dcv_response.json.txt_record | default('dcv_sample_txt_token_abc123xyz') }}

          SANs Included : {{ san_list | join(', ') }}
          =====================================================

          Please confirm once the record has been updated in DNS so Phase 2 can proceed.

          Automated via Ansible Automation Controller.

