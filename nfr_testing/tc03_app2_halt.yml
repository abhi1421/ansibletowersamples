---
- name: "TC03: APP Node-2 Abrupt Halt Failover NFR Test"
  hosts: localhost
  gather_facts: false
  vars:
    testcase_id: "TC03"
    testcase_name: "TC03: Application/GW Node-2 Abruptly goes down (HALT)"
    testcase_status: "FAILED"
    execution_logs: []

  tasks:
    - name: Execute TC03 NFR Test Scenario
      block:
        - name: Record Test Start Timestamp
          ansible.builtin.set_fact:
            start_ts: "{{ now().timestamp() }}"
            test_start_time: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

        - name: Safety Gate Check via AAP Survey Flag
          ansible.builtin.meta: end_play
          when: survey_execute_test | default(false) | bool == false

        # --- STEP 1: Set Bosboot & Bootlist on Secondary APP Node ---
        - name: Create boot image and set bootlist on rootvg disk (P9PDCPADAPP2)
          ansible.builtin.shell: |
            lspv | grep -i rootvg
            bosboot -ad /dev/hdisk0
            bootlist -om normal hdisk0
          delegate_to: "{{ app_cluster.secondary_node }}"
          register: bootlist_out

        - name: Record Bootlist Task Log
          ansible.builtin.set_fact:
            execution_logs: "{{ execution_logs + [{'name': '1. Set Bosboot and Bootlist on APP2', 'status': 'SUCCESS', 'output': bootlist_out.stdout}] }}"

        # --- STEP 2: Inject Abrupt Halt on Secondary APP Node ---
        - name: Execute abrupt halt command on P9PDCPADAPP2
          ansible.builtin.shell: sleep 2 && halt
          delegate_to: "{{ app_cluster.secondary_node }}"
          async: 1
          poll: 0
          ignore_errors: true

        - name: Record Halt Injection Log
          ansible.builtin.set_fact:
            execution_logs: "{{ execution_logs + [{'name': '2. Execute Halt Command on APP2', 'status': 'SUCCESS', 'output': 'Halt signal sent to ' + app_cluster.secondary_node}] }}"

        # --- STEP 3: Validate Automatic Failover on Primary APP Node ---
        - name: Wait and Verify Cluster Service IP and Mountpoints on P9PDCPADAPP1
          ansible.builtin.include_role:
            name: cluster_verify
          vars:
            target_node: "{{ app_cluster.primary_node }}"
            target_service_ip: "{{ app_cluster.secondary_service_ip }}"
            target_mountpoints: "{{ app_cluster.secondary_mounts }}"

        - name: Record Failover Validation Log
          ansible.builtin.set_fact:
            execution_logs: "{{ execution_logs + [{'name': '3. Service IP & Storage Failover Verification', 'status': 'SUCCESS', 'output': 'Secondary Service IP ' + app_cluster.secondary_service_ip + ' and mounts ' + (app_cluster.secondary_mounts | join(', ')) + ' active on ' + app_cluster.primary_node}] }}"

        # --- STEP 4: Start IBM MQ Queue Manager on Primary APP Node ---
        - name: Start Secondary Queue Manager manually on P9PDCPADAPP1
          ansible.builtin.shell: su - mqm -c "strmqm {{ item }}"
          loop: "{{ app_cluster.qmanagers.secondary }}"
          delegate_to: "{{ app_cluster.primary_node }}"
          register: mq_start_out
          ignore_errors: true

        - name: Verify Secondary MQ Queue Manager & Cluster Queues on P9PDCPADAPP1
          ansible.builtin.shell: |
            su - mqm -c "dspmq"
            su - mqm -c "runmqsc {{ app_cluster.qmanagers.secondary[0] }} <<< 'dis qc(*)'"
          delegate_to: "{{ app_cluster.primary_node }}"
          register: mq_verify_out

        - name: Record MQ Startup Log
          ansible.builtin.set_fact:
            execution_logs: "{{ execution_logs + [{'name': '4. MQ Queue Manager Verification', 'status': 'SUCCESS', 'output': mq_verify_out.stdout}] }}"

        # --- STEP 5: Mark Test Case as Passed ---
        - name: Set Scenario Status to PASSED
          ansible.builtin.set_fact:
            testcase_status: "PASSED"

      rescue:
        - name: Record Failure Details
          ansible.builtin.set_fact:
            testcase_status: "FAILED"
            execution_logs: "{{ execution_logs + [{'name': 'Failover Execution Error', 'status': 'FAILED', 'output': ansible_failed_result.msg | default('Failover verification or step execution failed.')}] }}"

      always:
        - name: Calculate Test Duration
          ansible.builtin.set_fact:
            execution_duration: "{{ ((now().timestamp() | int) - (start_ts | default(now().timestamp()) | int)) | abs }}"

        - name: Dispatch Instant Email Report for TC03
          ansible.builtin.include_role:
            name: send_email

        - name: Export Results to AAP Workflow Artifacts (set_stats)
          ansible.builtin.set_stats:
            data:
              workflow_nfr_results: "{{ {testcase_id: {'name': testcase_name, 'status': testcase_status, 'duration': execution_duration}} }}"
            aggregate: true