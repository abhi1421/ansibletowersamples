---
- name: "Master NFR Consolidated Execution Summary Report"
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Record Report Generation Timestamp
      ansible.builtin.set_fact:
        report_timestamp: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

    - name: Construct Master Consolidated HTML Summary Body
      ansible.builtin.set_fact:
        master_email_body: |
          <!DOCTYPE html>
          <html>
          <head>
            <style>
              body { font-family: Arial, sans-serif; margin: 20px; }
              .header { background-color: #003366; color: white; padding: 18px; border-radius: 5px; text-align: center; }
              .summary-box { background-color: #f4f6f9; padding: 15px; border-left: 5px solid #003366; margin-top: 15px; }
              table { width: 100%; border-collapse: collapse; margin-top: 20px; }
              th { background-color: #003366; color: white; text-align: left; padding: 12px; border: 1px solid #ddd; }
              td { padding: 12px; border: 1px solid #ddd; vertical-align: middle; }
              tr:nth-child(even) { background-color: #f9f9f9; }
              .status-passed { color: #2e7d32; font-weight: bold; background-color: #e8f5e9; padding: 4px 8px; border-radius: 3px; }
              .status-failed { color: #c62828; font-weight: bold; background-color: #ffebee; padding: 4px 8px; border-radius: 3px; }
              .footer { margin-top: 25px; font-size: 12px; color: #666; text-align: center; }
            </style>
          </head>
          <body>
            <div class="header">
              <h2>PowerHA Cluster NFR Failover Testing — Executive Summary Report</h2>
            </div>

            <div class="summary-box">
              <p><b>Execution Timestamp:</b> {{ report_timestamp }}</p>
              <p><b>Environment:</b> AIX PowerHA SystemMirror Cluster (AAP Automated Execution)</p>
              <p><b>Target Systems:</b> Application Cluster (APP1 / APP2) & Database Cluster (DB1 / DB2)</p>
            </div>

            <h3>Test Scenario Execution Matrix</h3>
            <table>
              <thead>
                <tr>
                  <th style="width: 12%;">Test ID</th>
                  <th style="width: 55%;">Test Scenario Description</th>
                  <th style="width: 18%;">Execution Status</th>
                  <th style="width: 15%;">Duration (Seconds)</th>
                </tr>
              </thead>
              <tbody>
                {% if workflow_nfr_results is defined and workflow_nfr_results | length > 0 %}
                  {% for tc_key, tc_val in workflow_nfr_results.items() %}
                  <tr>
                    <td><b>{{ tc_key }}</b></td>
                    <td>{{ tc_val.name }}</td>
                    <td>
                      <span class="{{ 'status-passed' if tc_val.status == 'PASSED' else 'status-failed' }}">
                        {{ tc_val.status }}
                      </span>
                    </td>
                    <td>{{ tc_val.duration }}s</td>
                  </tr>
                  {% endfor %}
                {% else %}
                  <tr>
                    <td colspan="4" style="text-align: center; color: #999;">
                      <i>No individual scenario artifacts were recorded during this run.</i>
                    </td>
                  </tr>
                {% endif %}
              </tbody>
            </table>

            <br>
            <div class="footer">
              <p>This report was automatically generated and dispatched by <b>Ansible Automation Platform (AAP)</b>.</p>
            </div>
          </body>
          </html>

    - name: Dispatch Master Executive Report Email via SMTP
      community.general.mail:
        host: "{{ email_config.smtp_host }}"
        port: "{{ email_config.smtp_port }}"
        from: "{{ email_config.sender }}"
        to: "{{ email_config.recipients }}"
        subject: "MASTER EXECUTIVE REPORT: PowerHA NFR Failover Testing Suite Results"
        body: "{{ master_email_body }}"
        subtype: html
      delegate_to: localhost