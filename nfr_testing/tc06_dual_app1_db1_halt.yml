---
- name: "TC06: Dual Simultaneous Halt Failover NFR Test (APP-1 & DB-1)"
  hosts: localhost
  gather_facts: false
  vars:
    testcase_id: "TC06"
    testcase_name: "TC06: Both Application Node-1 and Database Node-1 together abruptly go down (HALT)"
    testcase_status: "FAILED"
    execution_logs: []

  tasks:
    - name: Execute TC06 NFR Test Scenario
      block:
        - name: Record Test Start Timestamp
          ansible.builtin.set_fact:
            start_ts: "{{ now().timestamp() }}"
            test_start_time: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

        - name: Safety Gate Check via AAP Survey Flag
          ansible.builtin.meta: end_play
          when: survey_execute_test | default(false) | bool == false

        # --- STEP 1: Set Bosboot & Bootlist on Primary APP and DB Nodes ---
        - name: Set Bosboot and Bootlist on APP Node-1
          ansible.builtin.shell: |
            lspv | grep -i rootvg
            bosboot -ad /dev/hdisk0
            bootlist -om normal hdisk0
          delegate_to: "{{ app_cluster.primary_node }}"
          register: boot_app_out

        - name: Set Bosboot and Bootlist on DB Node-1
          ansible.builtin.shell: |
            lspv | grep -i rootvg
            bosboot -ad /dev/hdisk0
            bootlist -om normal hdisk0
          delegate_to: "{{ db_cluster.primary_node }}"
          register: boot_db_out

        - name: Record Bootlist Task Log
          ansible.builtin.set_fact:
            execution_logs: "{{ execution_logs + [{'name': '1. Set Bosboot and Bootlist on APP1 and DB1', 'status': 'SUCCESS', 'output': 'Bootlist updated on both primary nodes'}] }}"

        # --- STEP 2: Trigger Dual Abrupt Halt Simultaneously ---
        - name: Execute abrupt halt command on APP Node-1
          ansible.builtin.shell: sleep 2 && halt
          delegate_to: "{{ app_cluster.primary_node }}"
          async: 1
          poll: 0
          ignore_errors: true

        - name: Execute abrupt halt command on DB Node-1
          ansible.builtin.shell: sleep 2 && halt
          delegate_to: "{{ db_cluster.primary_node }}"
          async: 1
          poll: 0
          ignore_errors: true

        - name: Record Halt Injection Log
          ansible.builtin.set_fact:
            execution_logs: "{{ execution_logs + [{'name': '2. Execute Dual Halt Commands', 'status': 'SUCCESS', 'output': 'Simultaneous Halt signals sent to ' + app_cluster.primary_node + ' and ' + db_cluster.primary_node}] }}"

        # --- STEP 3: Validate Automatic Failover on Secondary APP Node ---
        - name: Verify APP Cluster Service IP and Mountpoints on P9PDCPADAPP2
          ansible.builtin.include_role:
            name: cluster_verify
          vars:
            target_node: "{{ app_cluster.secondary_node }}"
            target_service_ip: "{{ app_cluster.primary_service_ip }}"
            target_mountpoints: "{{ app_cluster.primary_mounts }}"

        - name: Start Primary Queue Managers manually on P9PDCPADAPP2
          ansible.builtin.shell: su - mqm -c "strmqm {{ item }}"
          loop: "{{ app_cluster.qmanagers.primary }}"
          delegate_to: "{{ app_cluster.secondary_node }}"
          register: mq_start_out
          ignore_errors: true

        - name: Verify APP Queue Managers and Cluster Queues on P9PDCPADAPP2
          ansible.builtin.shell: |
            su - mqm -c "dspmq"
            su - mqm -c "runmqsc {{ app_cluster.qmanagers.primary[0] }} <<< 'dis qc(*)'"
          delegate_to: "{{ app_cluster.secondary_node }}"
          register: mq_verify_out

        - name: Record APP Failover Validation Log
          ansible.builtin.set_fact:
            execution_logs: "{{ execution_logs + [{'name': '3. Application Layer Failover Verification', 'status': 'SUCCESS', 'output': 'Service IP, Storage & Queue Managers active on ' + app_cluster.secondary_node}] }}"

        # --- STEP 4: Validate Automatic Failover on Secondary DB Node ---
        - name: Verify DB Service IP and Mountpoints on P9PDCPADDB2
          ansible.builtin.include_role:
            name: cluster_verify
          vars:
            target_node: "{{ db_cluster.secondary_node }}"
            target_service_ip: "{{ db_cluster.primary_service_ip }}"
            target_mountpoints: "{{ db_cluster.primary_mounts }}"

        - name: Record DB Failover Validation Log
          ansible.builtin.set_fact:
            execution_logs: "{{ execution_logs + [{'name': '4. Database Layer Failover Verification', 'status': 'SUCCESS', 'output': 'DB Service IP and storage mountpoints active on ' + db_cluster.secondary_node}] }}"

        # --- STEP 5: Mark Test Case as Passed ---
        - name: Set Scenario Status to PASSED
          ansible.builtin.set_fact:
            testcase_status: "PASSED"

      rescue:
        - name: Record Failure Details
          ansible.builtin.set_fact:
            testcase_status: "FAILED"
            execution_logs: "{{ execution_logs + [{'name': 'Failover Execution Error', 'status': 'FAILED', 'output': ansible_failed_result.msg | default('Failover verification or step execution failed.')}] }}"

      always:
        - name: Calculate Test Duration
          ansible.builtin.set_fact:
            execution_duration: "{{ ((now().timestamp() | int) - (start_ts | default(now().timestamp()) | int)) | abs }}"

        - name: Dispatch Instant Email Report for TC06
          ansible.builtin.include_role:
            name: send_email

        - name: Export Results to AAP Workflow Artifacts (set_stats)
          ansible.builtin.set_stats:
            data:
              workflow_nfr_results: "{{ {testcase_id: {'name': testcase_name, 'status': testcase_status, 'duration': execution_duration}} }}"
            aggregate: true