---
- name: Target Node Pre-Checks
  hosts: all
  gather_facts: false
  tasks:
    # -------------------------------------------------------------------------
    # Task 1: Check Ansible SSH Reachability
    # -------------------------------------------------------------------------
    - name: Ping target node
      ansible.builtin.ping:
        data: pong
      ignore_unreachable: true
      register: ping_check

    # -------------------------------------------------------------------------
    # Task 2: Check Subscription-Manager Identity
    # -------------------------------------------------------------------------
    - name: Run subscription-manager identity
      ansible.builtin.command: subscription-manager identity
      register: sub_mgr_identity
      changed_when: false
      ignore_errors: true
      when: ping_check is not unreachable

    # -------------------------------------------------------------------------
    # Task 3: Store Host Status locally (No delegation to localhost)
    # -------------------------------------------------------------------------
    - name: Record host pre-check status
      ansible.builtin.set_fact:
        host_precheck_summary:
          hostname: "{{ inventory_hostname }}"
          ansible_reachable: "{{ ping_check is not unreachable }}"
          satellite_check: "{{ 'PASSED' if (ping_check is not unreachable and sub_mgr_identity is defined and sub_mgr_identity.rc == 0 and 'system identity:' in sub_mgr_identity.stdout) else 'FAILED' }}"


# -----------------------------------------------------------------------------
# Play 2: Extract facts from ALL hosts on Localhost
# -----------------------------------------------------------------------------
- name: Output Pre-Check Report
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Map all host records into consolidated report
      ansible.builtin.set_fact:
        consolidated_precheck_report: "{{ ansible_play_hosts_all | map('extract', hostvars, 'host_precheck_summary') | list }}"

    - name: Display Consolidated Pre-Check Report
      ansible.builtin.debug:
        var: consolidated_precheck_report