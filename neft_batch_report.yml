---
- name: NEFT Batch Settlement Check
  hosts: all
  gather_facts: false

  environment:
    ORACLE_SID: NEFT
    ORACLE_HOME: /orahome/app/product/19.0.0/dbhome_1
    PATH: /orahome/app/product/19.0.0/dbhome_1/bin:$PATH:.

  tasks:
    # -------------------------------------------------------------------------
    # 1. CALCULATE CURRENT BATCH NUMBER (1 to 48)
    # -------------------------------------------------------------------------
    - name: Get current batch index
      ansible.builtin.shell: |
        sqlplus -s ansibleapp/Rbi#2026 <<EOF
        WHENEVER SQLERROR EXIT FAILURE
        WHENEVER OSERROR EXIT FAILURE
        SET HEADING OFF FEEDBACK OFF PAGESIZE 0 VERIFY OFF TRIMSPOOL ON
        SELECT FLOOR((SYSDATE - TRUNC(SYSDATE)) * 48) FROM dual;
        EXIT;
        EOF
      register: current_batch_raw
      changed_when: false

    - name: Set target batch ID
      ansible.builtin.set_fact:
        target_batch_id: "{{ current_batch_raw.stdout | trim | int }}"

    # -------------------------------------------------------------------------
    # 2. QUERY DB WITH 5 RETRIES (1-MINUTE DELAY)
    # -------------------------------------------------------------------------
    - name: Fetch target batch status from database
      ansible.builtin.shell: |
        sqlplus -s ansibleapp/Rbi#2026 <<EOF
        WHENEVER SQLERROR EXIT FAILURE
        WHENEVER OSERROR EXIT FAILURE
        SET HEADING OFF FEEDBACK OFF PAGESIZE 0 VERIFY OFF TRIMSPOOL ON
        SELECT batch_id || '|' || BUSINESS_DATE || '|' || BATCH_STLMT_STATUS
        FROM UNEFT.VW_BATCH_STLMT_STATUS
        WHERE BUSINESS_DATE=TO_CHAR(SYSDATE,'YYYY-MM-DD') and batch_id = {{ target_batch_id }};
        EXIT;
        EOF
      register: db_query_result
      changed_when: false
      failed_when: false
      # Retry loop: check every 60 seconds up to 5 times until output is not empty
      until: db_query_result.stdout | trim != ""
      retries: 5
      delay: 60

    # -------------------------------------------------------------------------
    # 3. PARSE QUERY RESULTS & HANDLE TIMEOUT
    # -------------------------------------------------------------------------
    - name: Parse query output
      ansible.builtin.set_fact:
        batch_found: "{{ db_query_result.stdout | trim != '' }}"
        query_fields: "{{ (db_query_result.stdout | trim).split('|') if (db_query_result.stdout | trim != '') else [] }}"

    - name: Extract batch details
      ansible.builtin.set_fact:
        batch_id: "{{ query_fields[0] if batch_found else target_batch_id }}"
        batch_date: "{{ query_fields[1] if batch_found else 'N/A' }}"
        batch_status: "{{ query_fields[2] if batch_found else 'Batch Not Found (Timeout)' }}"

    # -------------------------------------------------------------------------
    # 4. CONSOLIDATED REPORT VARIABLE
    # -------------------------------------------------------------------------
    - name: Draft Consolidated Report Variable
      ansible.builtin.set_fact:
        consolidated_report: |
          ==================================================
                       NEFT BATCH STATUS REPORT
          ==================================================
          Execution Date   : {{ now(fmt='%Y-%m-%d %H:%M:%S') }}
          Target Batch ID  : {{ batch_id }}
          Settlement Date  : {{ batch_date }}
          Batch Status     : {{ batch_status }}
          ==================================================
          Execution Summary:
          {% if batch_found %}
          Batch {{ batch_id }} status was retrieved successfully with status '{{ batch_status }}'.
          {% else %}
          Batch {{ batch_id }} record was not found in the database after 5 minutes of polling.
          {% endif %}
          ==================================================

    # -------------------------------------------------------------------------
    # 5. DISPLAY REPORT FOR VERIFICATION
    # -------------------------------------------------------------------------
    - name: Display Consolidated Report
      ansible.builtin.debug:
        var: consolidated_report

    - name: Send consolidated Summary Email
      community.general.mail:
        host: 10.35.1.17
        port: 25
        to: "{{ email_recepients | join(', ') }}"
        from: ansible.alerts@rbi.org.in
        subject: "NEFT Batch {{ target_batch_id }} Status Update - {{ batch_status }}"
        body: "{{ consolidated_report }}"
      delegate_to: localhost
      run_once: true