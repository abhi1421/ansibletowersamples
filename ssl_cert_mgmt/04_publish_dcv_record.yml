---
- name: Step 04 - Publish TXT Record Notification
  hosts: localhost
  gather_facts: false
  
  tasks:
    - name: Notify DNS Support Team
      block:
        - name: Generate Consolidated Email Body Variable
          ansible.builtin.set_fact:
            email_body_content: |
              Hello DNS Support Team,

              A new SSL Certificate request requires DNS Control Validation (DCV).
              Please publish the following DNS TXT record at your earliest convenience:

              --------------------------------------------------
              Domain / Common Name : {{ common_name_input | default('demo-cert.rbi.org.in') }}
              Record Type          : TXT
              TXT Record Name      : _dcv-challenge.{{ common_name_input | default('demo-cert.rbi.org.in') }}
              TXT Record Value     : {{ dcv_content | default('NO_DCV_CONTENT_FOUND') }}
              --------------------------------------------------

              Once published, please confirm so the validation process can proceed.

              Regards,
              Automated Certificate Lifecycle Manager (AAP)

#        - name: Send TXT Update Email to Support
#          community.general.mail:
#            host: "localhost"
#            port: 25
#            to: "{{ recipient_list | default('dns-support@rbi.org.in') }}"
#            subject: "[Action Required] Publish DNS TXT Record for {{ common_name_input | default('demo-cert.rbi.org.in') }}"
#            body: "{{ email_body_content }}"

        - name: Construct Step Success Summary & Consolidated Phase 1 Report
          ansible.builtin.set_fact:
            step_4_summary: "Step 04 [DNS Notification]: SUCCESS | Email Sent"
            final_report: "{{ (phase_summary_report | default([])) + ['Step 04 [DNS Notification]: SUCCESS - Email Sent'] }}"

      rescue:
        - name: Construct Step Failure Summary
          ansible.builtin.set_fact:
            step_4_summary: "Step 04 [DNS Notification]: FAILED | {{ ansible_failed_result.msg | default('Email Dispatch Failed') }}"
            final_report: "{{ (phase_summary_report | default([])) + ['Step 04 [DNS Notification]: FAILED - Email Dispatch Failed'] }}"

        - name: Fail task execution
          ansible.builtin.fail:
            msg: "Step 04 Failed."

      always:
        - name: Push Facts & Phase 1 Report
          ansible.builtin.set_stats:
            data:
              step_4_summary: "{{ step_4_summary }}"
              phase_1_consolidated_report: "{{ final_report | join('\n') }}"