---
- name: AAP 2.6 Cross-Site Backup and Sync Playbook
  hosts: localhost
  gather_facts: false
  vars:
    # Site Installer & Host Mappings
    site_config:
      pdc:
        installer_dir: "/opt/aap-installer/ansible-automation-platform-containerized-setup-bundle-2.6"
        controller_host: "172.22.7.22" # PDC Controller 01
      odc:
        installer_dir: "/opt/aap-installer/ansible-automation-platform-containerized-setup-bundle-2.6"
        controller_host: "172.23.7.22" # ODC Controller 01

  tasks:
    - name: Validate Survey Inputs
      ansible.builtin.assert:
        that:
          - target_site in ['pdc', 'odc']
        fail_msg: "Invalid survey input! Must be 'pdc' or 'odc'."

    - name: Map Source and Destination Sites
      ansible.builtin.set_fact:
        src_site: "{{ target_site }}"
        dst_site: "{{ 'odc' if target_site == 'pdc' else 'pdc' }}"

    - name: Set Site Execution Facts
      ansible.builtin.set_fact:
        src_host: "{{ site_config[src_site]['controller_host'] }}"
        src_dir: "{{ site_config[src_site]['installer_dir'] }}"
        dst_host: "{{ site_config[dst_site]['controller_host'] }}"
        dst_dir: "{{ site_config[dst_site]['installer_dir'] }}"

# -------------------------------------------------------------------
# STEP 1: EXECUTE BACKUP ON SOURCE SITE
# -------------------------------------------------------------------
- name: Perform AAP Backup on Source Controller
  hosts: "{{ hostvars['localhost']['src_host'] }}"
  gather_facts: false
  vars:
    ansible_user: "ansible"
  tasks:
    - name: Run Containerized Installer Backup Command
      ansible.builtin.command:
        cmd: "ansible-playbook -i inventory ansible.containerized_installer.backup"
        chdir: "{{ hostvars['localhost']['src_dir'] }}"
      register: backup_exec

    - name: Verify Source Backups Directory State
      ansible.builtin.stat:
        path: "{{ hostvars['localhost']['src_dir'] }}/backups"
      register: src_backup_stat

    - name: Assert Backups Directory Exists
      ansible.builtin.assert:
        that:
          - src_backup_stat.stat.exists
          - src_backup_stat.stat.isdir
        fail_msg: "Backups directory does not exist after backup execution!"

    - name: Set Backup Ownership & Permission Facts
      ansible.builtin.set_fact:
        backup_owner: "{{ src_backup_stat.stat.pw_name }}"
        backup_group: "{{ src_backup_stat.stat.gr_name }}"
        backup_mode: "{{ src_backup_stat.stat.mode }}"

# -------------------------------------------------------------------
# STEP 2: TRANSFER BACKUPS DIRECTORY TO DESTINATION SITE
# -------------------------------------------------------------------
- name: Synchronize Backups Directory Across Sites
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Fetch Backups Directory Contents to Management Node
      ansible.builtin.fetch:
        src: "{{ src_dir }}/backups/"
        dest: "/tmp/aap_backups_sync/"
      delegate_to: "{{ src_host }}"

    - name: Ensure Backups Directory Structure Exists on Destination
      ansible.builtin.file:
        path: "{{ dst_dir }}/backups"
        state: directory
        owner: "{{ hostvars[src_host]['backup_owner'] }}"
        group: "{{ hostvars[src_host]['backup_group'] }}"
        mode: "{{ hostvars[src_host]['backup_mode'] }}"
      delegate_to: "{{ dst_host }}"

    - name: Copy Backups Directory Contents to Destination Installer Path
      ansible.builtin.copy:
        src: "/tmp/aap_backups_sync/{{ src_host }}/{{ src_dir }}/backups/"
        dest: "{{ dst_dir }}/backups/"
        owner: "{{ hostvars[src_host]['backup_owner'] }}"
        group: "{{ hostvars[src_host]['backup_group'] }}"
        mode: "{{ hostvars[src_host]['backup_mode'] }}"
      delegate_to: "{{ dst_host }}"

    - name: Verify Destination Backups Directory Permissions
      ansible.builtin.stat:
        path: "{{ dst_dir }}/backups"
      delegate_to: "{{ dst_host }}"
      register: dst_backup_stat

    - name: Build Consolidated Backup Execution Summary
      ansible.builtin.set_fact:
        backup_summary_report: |
          ==================================================
          AAP 2.6 BACKUP & CROSS-SITE SYNC SUMMARY
          ==================================================
          Backup Executed On Site        : {{ src_site | upper }} ({{ src_host }})
          Synced To Destination Site     : {{ dst_site | upper }} ({{ dst_host }})
          Source Backups Directory       : {{ src_dir }}/backups
          Source Ownership & Mode        : {{ hostvars[src_host]['backup_owner'] }}:{{ hostvars[src_host]['backup_group'] }} ({{ hostvars[src_host]['backup_mode'] }})
          Destination Backups Directory  : {{ dst_dir }}/backups
          Destination Ownership & Mode   : {{ dst_backup_stat.stat.pw_name }}:{{ dst_backup_stat.stat.gr_name }} ({{ dst_backup_stat.stat.mode }})
          Sync Execution Status          : SUCCESSFUL
          ==================================================

    - name: Display Backup Summary
      ansible.builtin.debug:
        msg: "{{ backup_summary_report.split('\n') }}"